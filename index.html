    <!--
      Intro overlay. Its styles are inline, and the letters are an embedded
      image, so it paints on the very first frame without waiting for the
      stylesheet, the fonts or any JavaScript. src/utils/intro.js fades it
      out as soon as the page behind it is ready.
    -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background:
          radial-gradient(75% 65% at 60% 55%, rgb(20 96 106 / 78%) 0%, rgb(20 96 106 / 36%) 42%, rgb(20 96 106 / 0%) 84%),
          #0b1721;
        transition: opacity 280ms ease-out;
      }

      #intro.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .intro-logo {
        display: flex;
        align-items: flex-end;
        gap: clamp(0.3rem, 1vw, 0.45rem);
      }

      .intro-logo img {
        display: block;
        width: auto;
        height: clamp(2.75rem, 9vw, 4rem);
      }

      /* The one playful touch: the lime dot hops once and settles. */
      .intro-dot {
        width: clamp(0.85rem, 2.8vw, 1.25rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #c8f55a;
        box-shadow: 0 0 18px rgb(200 245 90 / 60%);
        transform-origin: 50% 100%;
        animation: intro-hop 820ms cubic-bezier(0.33, 0, 0.3, 1) 120ms both;
      }

      @keyframes intro-hop {
        0% { transform: translateY(0) scale(1, 1); }
        14% { transform: translateY(0) scale(1.18, 0.8); }
        45% { transform: translateY(-230%) scale(0.94, 1.08); }
        72% { transform: translateY(0) scale(1.14, 0.86); }
        86% { transform: translateY(-26%) scale(1, 1); }
        100% { transform: translateY(0) scale(1, 1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .intro-dot { animation: none; }
        #intro { transition-duration: 160ms; }
      }
    </style>
    <noscript><style>#intro { display: none; }</style></noscript>
  </head>

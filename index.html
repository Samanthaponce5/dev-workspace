    <!--
      Display settings the visitor saved earlier, put on <html> before
      anything paints so the page never flashes its defaults first.
      Keep the key and attribute names in step with src/utils/displaySettings.js.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('display-settings'))
        var root = document.documentElement
        if (saved && saved.textSize === 'large') root.dataset.textSize = 'large'
        if (saved && saved.contrast === 'high') root.dataset.contrast = 'high'
        if (saved && saved.motion === 'reduced') root.dataset.motion = 'reduced'
      } catch (error) {
        /* No storage, or nothing usable in it: the defaults apply. */
      }
    </script>

    <!--
      Intro overlay: the SP logo, its lime dot and a tiny duck, centred on
      the page's own background. The styles are inline and both pictures
      are embedded, so it paints on the very first frame without waiting
      for the stylesheet, the fonts or any JavaScript.

      src/intro/reveal.js plays the reveal as soon as the page behind is
      ready: the duck hops to the monitor shelf, the logo glides into the
      navbar, and the background is wiped away. While "intro-pending" is
      on <html>, the real navbar logo is hidden so there is only ever one.

      The embedded images and the three ratios below are generated from
      the real logo and scene by `npm run posters`; don't edit them by hand.
    -->
    <style>
      .intro-pending [data-site-logo] {
        visibility: hidden;
      }

      #intro {
        /* intro-geometry */ --dot-ratio: 0.4307; --gap-ratio: 0.1184; --drop-ratio: 0.0579; /* /intro-geometry */
        --h: clamp(3.5rem, 9vw, 6.5rem); /* height of the letters */
        --wipe-x: 50%;
        --wipe-y: 50%;
        --wipe-r: -1px;
        position: fixed;
        inset: 0;
        z-index: 100;
      }

      /* The background is one layer so the wipe can cut a growing hole in it. */
      .intro-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(75% 65% at 60% 55%, rgb(20 96 106 / 78%) 0%, rgb(20 96 106 / 36%) 42%, rgb(20 96 106 / 0%) 84%),
          #0b1721;
        -webkit-mask-image: radial-gradient(circle at var(--wipe-x) var(--wipe-y), transparent calc(var(--wipe-r) - 56px), #000 var(--wipe-r));
        mask-image: radial-gradient(circle at var(--wipe-x) var(--wipe-y), transparent calc(var(--wipe-r) - 56px), #000 var(--wipe-r));
      }

      /* A faint band of aqua light riding the wipe's edge. */
      .intro-edge {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at var(--wipe-x) var(--wipe-y),
          transparent calc(var(--wipe-r) - 70px),
          rgb(113 201 200 / 22%) calc(var(--wipe-r) - 14px),
          transparent calc(var(--wipe-r) + 6px)
        );
        opacity: 0;
      }

      #intro[data-state='revealing'] .intro-edge {
        opacity: 1;
      }

      .intro-mark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .intro-row {
        display: flex;
        align-items: flex-end;
      }

      /* Letters and dot keep the navbar logo's proportions, so they can land on it exactly. */
      .intro-letters {
        display: block;
        width: auto;
        height: var(--h);
        transform-origin: 0 0;
      }

      .intro-dot {
        width: calc(var(--h) * var(--dot-ratio));
        aspect-ratio: 1;
        margin-left: calc(var(--h) * var(--gap-ratio));
        margin-bottom: calc(var(--h) * var(--drop-ratio));
        border-radius: 50%;
        background: #c8f55a;
        transform-origin: 0 0;
      }

      /* About a third of the letters' height, bobbing gently while the page loads. */
      .intro-duck {
        display: block;
        width: auto;
        height: calc(var(--h) / 3);
        margin-left: calc(var(--h) * 0.14);
        margin-bottom: calc(var(--h) * 0.05);
        transform-origin: 50% 50%;
        animation: intro-bob 1.1s ease-in-out infinite alternate;
      }

      @keyframes intro-bob {
        to { transform: translateY(-9%); }
      }

      /* Once the reveal starts, JavaScript drives every transform. */
      #intro[data-state] .intro-duck {
        animation: none;
      }

      #intro[data-state='revealing'] .intro-row > * {
        will-change: transform;
      }

      /* Landed: the moving pieces fade over the real logo and duck beneath them. */
      #intro[data-state='done'] {
        pointer-events: none;
      }

      #intro[data-state='done'] .intro-bg,
      #intro[data-state='done'] .intro-edge {
        display: none;
      }

      #intro[data-state='done'] .intro-row > * {
        opacity: 0;
        transition: opacity 90ms linear;
      }

      /* Reduced motion: no hop, no wipe, just a quick fade. */
      #intro[data-state='fading'] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .intro-duck { animation: none; }
      }

      [data-motion='reduced'] .intro-duck { animation: none; }
    </style>
    <noscript><style>#intro { display: none; } .intro-pending [data-site-logo] { visibility: visible; }</style></noscript>

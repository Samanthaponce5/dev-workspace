<!doctype html>
<html lang="en" class="intro-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Samantha Ponce · Front-End Developer</title>
    <meta
      name="description"
      content="Samantha Ponce is a front-end developer growing into full-stack, currently at Podchaser. React, accessible UI, APIs and AI tooling."
    />
    <meta name="theme-color" content="#0b1721" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Samantha Ponce · Front-End Developer" />
    <meta
      property="og:description"
      content="Front-end developer growing into full-stack, currently at Podchaser. Come say hi to me and Andy at my tiny desk."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The theme and display settings the visitor saved earlier, put on
      <html> before anything paints so the page never flashes its defaults
      (the Dark theme, say) first.
      Keep the key and attribute names in step with src/utils/displaySettings.js.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('display-settings'))
        var root = document.documentElement
        if (saved && saved.appearance === 'light') root.dataset.theme = 'light'
        if (saved && saved.textSize === 'large') root.dataset.textSize = 'large'
        if (saved && saved.contrast === 'high') root.dataset.contrast = 'high'
        if (saved && saved.motion === 'reduced') root.dataset.motion = 'reduced'
      } catch (error) {
        /* No storage, or nothing usable in it: the defaults apply. */
      }
    </script>

    <!--
      Intro overlay: the SP logo swirling together from five rounded pieces
      of its own letters, its lime dot landing beside it with one soft glow,
      and a tiny duck that reacts to it, on the page's own background. All of that is CSS, so it plays from the first frame
      without waiting for any JavaScript, while the 3D scene loads behind it.

      Its colours are the site's theme tokens (src/styles/tokens.css), so it
      matches Dark, Light and High contrast. In the built site that
      stylesheet blocks rendering, so the tokens are always there by the
      first paint; the fallbacks are the Dark values, for the dev server.

      src/intro/reveal.js waits for the assembly to finish and for the page
      behind to be ready, then plays the reveal: the logo glides into the
      navbar along a curve, trailing a thin line of light, the duck hops to
      the monitor shelf, and the page rises into view under a glowing arc,
      like the edge of a planet. While "intro-pending" is on <html>,
      the real navbar logo is hidden so there is only ever one.

      The letters, the duck picture and the three ratios below are generated
      from the real logo and scene by `npm run posters`; don't edit them by
      hand.
    -->
    <style>
      .intro-pending [data-site-logo] {
        visibility: hidden;
      }

      #intro {
        /* intro-geometry */ --dot-ratio: 0.4307; --gap-ratio: 0.1184; --drop-ratio: 0.0579; /* /intro-geometry */
        --h: clamp(3.5rem, 9vw, 6.5rem); /* height of the letters */
        --lime: var(--color-lime, #c8f55a);
        --wipe-x: 50%;
        --wipe-y: 50%;
        --wipe-r: -1px;
        position: fixed;
        inset: 0;
        z-index: 100;
      }

      /* The page's own background and its pool of light. One layer, so the sweep can cut a growing hole in it. */
      .intro-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(75% 65% at 60% 55%, color-mix(in srgb, var(--color-glow, #14606a) 78%, transparent) 0%, color-mix(in srgb, var(--color-glow, #14606a) 36%, transparent) 42%, transparent 84%),
          var(--page-wash, none),
          var(--color-bg, #0b1721);
        -webkit-mask-image: radial-gradient(circle at var(--wipe-x) var(--wipe-y), transparent calc(var(--wipe-r) - 20px), #000 var(--wipe-r));
        mask-image: radial-gradient(circle at var(--wipe-x) var(--wipe-y), transparent calc(var(--wipe-r) - 20px), #000 var(--wipe-r));
      }

      /*
       * The sweep's rim: a bright line of teal light right on its edge, with
       * a soft glow spilling onto the page it uncovers and a fainter one
       * onto the background it is about to clear, like the edge of a planet.
       */
      .intro-edge {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at var(--wipe-x) var(--wipe-y),
          transparent calc(var(--wipe-r) - 170px),
          color-mix(in srgb, var(--color-aqua, #71c9c8) 16%, transparent) calc(var(--wipe-r) - 70px),
          color-mix(in srgb, var(--color-aqua, #71c9c8) 55%, transparent) calc(var(--wipe-r) - 14px),
          color-mix(in srgb, var(--color-accent-strong, #c9ece2) 95%, transparent) calc(var(--wipe-r) - 9px),
          color-mix(in srgb, var(--color-accent-strong, #c9ece2) 95%, transparent) calc(var(--wipe-r) - 7px),
          color-mix(in srgb, var(--color-aqua, #71c9c8) 30%, transparent) calc(var(--wipe-r) + 2px),
          transparent calc(var(--wipe-r) + 46px)
        );
        opacity: 0;
      }

      /* The light trail the logo leaves as it flies to the navbar (drawn by reveal.js). */
      .intro-trail {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        fill: none;
        stroke-linecap: round;
      }

      .intro-trail path {
        opacity: 0;
      }

      .intro-trail-glow {
        stroke: color-mix(in srgb, var(--lime) 35%, transparent);
        stroke-width: 6px;
      }

      .intro-trail-core {
        stroke: var(--lime);
        stroke-width: 1.5px;
      }

      #intro[data-state='revealing'] .intro-edge {
        opacity: 1;
      }

      .intro-mark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .intro-row {
        position: relative;
        display: flex;
        align-items: flex-end;
      }

      /* A soft pool of light on the "floor" under the logo, as if it were standing on something. */
      .intro-row::before {
        content: '';
        position: absolute;
        left: -12%;
        right: -6%;
        bottom: calc(var(--h) * -0.38);
        height: calc(var(--h) * 0.5);
        border-radius: 50%;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--color-aqua, #71c9c8) 45%, transparent), transparent);
        filter: blur(calc(var(--h) * 0.06));
        animation: intro-floor 600ms ease-out 150ms both;
        transition: opacity 220ms ease-out;
        pointer-events: none;
      }

      #intro[data-state] .intro-row::before {
        opacity: 0;
      }

      /* On the light page, a lighter pool, so it reads as light rather than a shadow. */
      [data-theme='light'] .intro-row::before {
        background: radial-gradient(closest-side, color-mix(in srgb, var(--color-aqua, #71c9c8) 22%, transparent), transparent);
      }

      @keyframes intro-floor {
        from {
          opacity: 0;
          transform: scaleX(0.4);
        }
      }

      /*
       * The letters, in the navbar logo's colour and proportions so they can
       * land on it exactly. Five rounded pieces of them swirl in along their
       * own curves and join; then the exact letters take over in a very
       * short crossfade. Each piece's path and timing are written into the
       * SVG (see scripts/capture-posters.mjs).
       */
      .intro-letters {
        display: block;
        width: auto;
        height: var(--h);
        overflow: visible;
        color: var(--color-text, #eef7f6);
        transform-origin: 0 0;
      }

      .intro-piece {
        transform-box: view-box;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .intro-whole {
        opacity: 0;
      }

      /* A short teal trail behind a piece on its way in. */
      .intro-swirl-trail {
        fill: none;
        stroke: color-mix(in srgb, var(--color-aqua, #71c9c8) 60%, transparent);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 0.24 2;
        opacity: 0;
      }

      @keyframes intro-appear {
        from {
          opacity: 0;
        }
      }

      @keyframes intro-fade-out {
        to {
          opacity: 0;
        }
      }

      @keyframes intro-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Once the letters have formed, the dot drops in beside the P, settles with one small bounce, and glows once as it lands. */
      .intro-dot {
        position: relative;
        width: calc(var(--h) * var(--dot-ratio));
        aspect-ratio: 1;
        margin-left: calc(var(--h) * var(--gap-ratio));
        margin-bottom: calc(var(--h) * var(--drop-ratio));
        transform-origin: 0 0;
      }

      .intro-dot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--lime);
        /* The navbar dot's glow, in proportion, so the two match when this one lands on it. */
        box-shadow: 0 0 calc(var(--h) * var(--dot-ratio) * 1.7) color-mix(in srgb, var(--lime) 60%, transparent);
        transform-origin: 50% 100%;
        animation: intro-drop 320ms linear 900ms both;
      }

      @keyframes intro-drop {
        0% {
          transform: translateY(calc(var(--h) * -0.55));
          opacity: 0;
          animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.5);
        }
        18% {
          opacity: 1;
        }
        60% {
          transform: translateY(0) scale(1.06, 0.94);
          box-shadow: 0 0 calc(var(--h) * 0.42) color-mix(in srgb, var(--lime) 80%, transparent);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        80% {
          transform: translateY(calc(var(--h) * -0.04)) scale(0.99, 1.01);
          animation-timing-function: ease-in-out;
        }
        100% {
          transform: none;
          opacity: 1;
        }
      }

      /* A few small lime sparks fly off the dot as it lands: the soft pop. */
      .intro-spark {
        position: absolute;
        left: 25%;
        bottom: 95%;
        width: 150%;
        height: 150%;
        overflow: visible;
        stroke: var(--lime);
        stroke-width: 2.2;
        stroke-linecap: round;
        pointer-events: none;
      }

      .intro-spark line {
        stroke-dasharray: 10;
        stroke-dashoffset: 10;
        opacity: 0;
        animation: intro-spark 320ms cubic-bezier(0.2, 0.8, 0.3, 1) 1080ms both;
      }

      .intro-spark line:nth-child(2) {
        animation-delay: 1100ms;
      }

      .intro-spark line:nth-child(3) {
        animation-delay: 1120ms;
      }

      @keyframes intro-spark {
        20% {
          opacity: 1;
        }
        60% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        to {
          stroke-dashoffset: -10;
          opacity: 0;
        }
      }

      /*
       * The duck, about a third of the letters' height. It pops up beside
       * the logo, gives a happy little hop and a tilt of the head when the
       * dot lands, and bobs gently while the page loads.
       */
      .intro-duck {
        display: block;
        width: auto;
        height: calc(var(--h) / 3);
        margin-left: calc(var(--h) * 0.14);
        margin-bottom: calc(var(--h) * 0.05);
        transform-origin: 50% 100%;
        animation:
          intro-duck-in 300ms cubic-bezier(0.34, 1.4, 0.64, 1) 760ms both,
          intro-duck-react 300ms ease-in-out 1080ms,
          intro-bob 1.1s ease-in-out 1380ms infinite alternate;
      }

      @keyframes intro-duck-in {
        from {
          transform: translateY(35%) scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      @keyframes intro-duck-react {
        35% {
          transform: translateY(-26%) rotate(-10deg);
        }
        70% {
          transform: translateY(0) rotate(6deg);
        }
      }

      @keyframes intro-bob {
        to { transform: translateY(-9%); }
      }

      /* Once the reveal starts, JavaScript drives every transform. */
      #intro[data-state] .intro-duck {
        animation: none;
        transform-origin: 50% 50%;
      }

      #intro[data-state='revealing'] .intro-row > * {
        will-change: transform;
      }

      /* Landed: the moving pieces fade over the real logo and duck beneath them. */
      #intro[data-state='done'] {
        pointer-events: none;
      }

      #intro[data-state='done'] .intro-bg,
      #intro[data-state='done'] .intro-edge {
        display: none;
      }

      #intro[data-state='done'] .intro-row > * {
        opacity: 0;
        transition: opacity 90ms linear;
      }

      /* Reduced motion: the logo and duck are simply there, and the reveal is a quick fade. */
      #intro[data-state='fading'] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        #intro *,
        #intro *::before {
          animation: none !important;
        }

        #intro .intro-piece,
        #intro .intro-swirl-trail,
        #intro .intro-spark {
          visibility: hidden;
        }

        #intro .intro-whole {
          opacity: 1;
        }
      }

      [data-motion='reduced'] #intro *,
      [data-motion='reduced'] #intro *::before {
        animation: none !important;
      }

      [data-motion='reduced'] #intro .intro-piece,
      [data-motion='reduced'] #intro .intro-swirl-trail,
      [data-motion='reduced'] #intro .intro-spark {
        visibility: hidden;
      }

      [data-motion='reduced'] #intro .intro-whole {
        opacity: 1;
      }
    </style>
    <noscript><style>#intro { display: none; } .intro-pending [data-site-logo] { visibility: visible; }</style></noscript>
  </head>
